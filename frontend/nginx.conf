server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  # Reach the API via the host-published port. Some environments block
  # container-to-container traffic on the Compose bridge network.
  location /api/ {
    proxy_pass http://host.docker.internal:8091/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /actuator/ {
    proxy_pass http://host.docker.internal:8091/actuator/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
